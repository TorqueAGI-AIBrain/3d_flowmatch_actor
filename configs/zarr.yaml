# zarr.yaml: Episode directory to zarr conversion config.

# Input/output paths
root: data/xarm/place_object_in_toolbox_episodes
tgt: data/xarm/place_object_in_toolbox_zarr

# Tasks to include (must match subfolder name under root)
tasks:
  - default_task_fixed_v3

# Camera names (must match filenames in episode rgb/depth folders)
cameras:
  - front
  - wrist

# Robot
nhand: 1

# Processing
val_ratio: 0.1
trajectory_length: 50  # match hiveformer pretrained format
num_history: 3

# Keyframe detection
# Use distance-based keyframes (0.5 inch) since gripper state is constant
# for this task (no open/close events captured in bags)
keyframe_gripper_change: false
keyframe_velocity_threshold: 0.01
keyframe_distance_threshold: 0.0127  # 0.5 inch in metres

# Quaternion format in eef_states.npy (ROS PoseStamped uses xyzw)
input_quat_format: xyzw
