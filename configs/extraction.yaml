# extraction.yaml: ROS2 bag to episode directory extraction config.

# Input/output paths
bag_dir: data/xarm
output_dir: data/xarm/default_task_fixed_v3_episodes
tasks:
  - default_task_fixed_v3

# Robot
robot:
  eef_topic: /eef_pose
  gripper_topic: /gripper_position
  world_frame: link_base

# Camera configuration
cameras:
  front:
    rgb_topic: /front/color/image_raw
    depth_topic: /front/depth/image_raw
    camera_info_topic: /front/camera_info
    tf_frame: front_optical_frame
  wrist:
    rgb_topic: /wrist/color/image_raw
    depth_topic: /wrist/depth/image_raw
    camera_info_topic: /wrist/camera_info
    tf_frame: wrist_optical_frame
    # Dynamic TF chain: link_base -> joint chain -> static links -> camera
    tf_chain:
      - [link_base, link1]
      - [link1, link2]
      - [link2, link3]
      - [link3, link4]
      - [link4, link5]
      - [link5, link6]
      - [link6, link_ft_adapter]
      - [link_ft_adapter, link_ft_sensor]
      - [link_ft_sensor, link_eef]
      - [link_eef, wrist_optical_frame]

# Processing
image_size: 256
target_hz: 10.0
sync_slop: 0.05
